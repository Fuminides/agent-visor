[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-visor"
version = "0.1.0"
description = "A local visual companion for terminal coding agents"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.scripts]
visor = "agent_visor.cli:main"

[tool.setuptools.packages.find]
include = ["agent_visor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
